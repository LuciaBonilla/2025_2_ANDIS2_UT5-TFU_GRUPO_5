spring:
  application:
    name: UT5_TFU_USER

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/projectmanager}
    username: ${SPRING_DATASOURCE_USERNAME:projectuser}
    password: ${SPRING_DATASOURCE_PASSWORD:projectpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
